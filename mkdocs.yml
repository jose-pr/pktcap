site_name: pktcap
site_description: "Capture files for UDP protocol libraries: read pcap and pcapng, decode to datagrams, write pcap and structured records, replay"
site_url: https://jose-pr.github.io/pktcap/
repo_url: https://github.com/jose-pr/pktcap
repo_name: jose-pr/pktcap
edit_uri: edit/main/docs/

# Constrain the scan to docs/ so pymdownx.snippets and strict nav do not trip
# on repo-level markdown.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - API Reference:
      - Overview: api/reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
