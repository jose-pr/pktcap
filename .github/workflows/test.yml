name: Test

# On-demand test workflow, kept separate from release.yml's own release-gate
# test job so it can be run without cutting a release. Two ways to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so a run can
#     be triggered and polled through the API or the CLI.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The gate behind the shipped type promise: `py.typed` tells a caller the
    # surface is checked, and this job is what checks it.
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          # The floor: `[tool.mypy] python_version = "3.9"`.
          python-version: "3.9"
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check src/ tests/
      - name: Type-check the package for every target platform
        # mypy checks every per-platform branch whatever host it runs on, but
        # resolves a platform-only name (socket.AF_PACKET) against the
        # platform it targets, so one clean run says nothing about the others.
        run: |
          python -m mypy --platform linux src/pktcap
          python -m mypy --platform darwin src/pktcap
          python -m mypy --platform win32 src/pktcap
      - name: Type-check the public typing contract
        # tests/typing/api.py is what a caller of the installed package may
        # write; pytest never collects it, so this step is what runs it.
        run: python -m mypy tests/typing/api.py

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        # Install every extra that has tests depending on it, or those tests
        # skip (pytest.importorskip) and do not run.
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        # -rs prints the reason for every skip: a skip is not a pass.
        run: python -m pytest -q -rs

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only ever gets the newest
  # releases, so a floor that does not work would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # What `pip install pktcap` gives with no extra: the library imports, and a
  # format whose extra is missing says which extra to install. The test jobs
  # above always have every extra.
  bare:
    name: Bare install (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with no extra
        run: python -m pip install .
      - name: The library imports, and a missing extra is named
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.resources import files

          import pktcap

          root = files("pktcap")
          for name in ("py.typed", "AGENTS.md"):
              assert (root / name).is_file(), "the install does not ship %s" % name
          assert pktcap.dumps_record({"a": 1}, "json") == '{"a": 1}\n'
          try:
              pktcap.dumps_record({"a": 1}, "yaml")
          except ImportError as exc:
              assert "pktcap[yaml]" in str(exc), exc
          else:
              raise SystemExit("yaml was written without the yaml extra")
          print("ok:", pktcap.__version__)
          PY
      - name: The command line without its extra names the extra
        # The console script is installed either way: with no duho it prints
        # the one line naming the extra and exits 1, never a traceback.
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          status=0
          python -m pktcap --help 2> stderr.txt || status=$?
          cat stderr.txt
          test "$status" = 1
          test "$(cat stderr.txt)" = "pktcap: error: the command line needs the 'cli' extra: pip install \"pktcap[cli]\""
